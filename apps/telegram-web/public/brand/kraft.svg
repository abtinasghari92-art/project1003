<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="fiber" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.89  0 0 0 0 0.78  0 0 0 0 0.60  0 0 0 0.55 0" result="tinted"/>
    </filter>
    <filter id="speck" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.35" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.40  0 0 0 0 0.22  0 0 0 0.18 0"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#e4c79b"/>
  <rect width="400" height="400" filter="url(#fiber)"/>
  <rect width="400" height="400" filter="url(#speck)" opacity="0.35"/>
</svg>
